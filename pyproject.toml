[project]
name = "smolchat"
version = "0.1.0"
description = "SmolChat for macOS – private, offline chat with the Smol family of models (SmolWorks)."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "Apache-2.0" }
dependencies = [
    "PySide6-Essentials>=6.8",
    "llama-cpp-python>=0.3.16",
]

[project.optional-dependencies]
dev = [
    "pytest>=8",
    "ruff>=0.4",
]
package = ["pyinstaller>=6.10"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100

[tool.ruff.lint]
extend-select = ["N802", "E402", "BLE001"]
ignore = ["B008"]

[tool.ruff.lint.per-file-ignores]
"app/inference.py" = ["BLE001", "S110"]
"tests/*" = ["RUF012", "RUF059"]
